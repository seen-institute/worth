name: CI

on:
  push:
    branches: [main]
  pull_request:

# The test suite is offline by design: it reads the committed fixtures, never
# cms.gov. A CI run that needs the network is a CI run that can go red because
# someone else's server had a bad day.
env:
  UV_FROZEN: "1"

jobs:
  check:
    name: ruff, mypy, pytest
    runs-on: ubuntu-latest
    # The db-marked tests apply the schema to this empty database and load the
    # committed fixture into it; everything else stays offline.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worth
          POSTGRES_PASSWORD: worth
          POSTGRES_DB: worth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worth -d worth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://worth:worth@127.0.0.1:5432/worth
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --locked

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest
