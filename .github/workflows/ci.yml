name: CI

on:
  push:
    branches: [main]
  pull_request:

# The test suite is offline by design: it reads the committed fixtures, never
# cms.gov. A CI run that needs the network is a CI run that can go red because
# someone else's server had a bad day.
env:
  UV_FROZEN: "1"

jobs:
  check:
    name: ruff, mypy, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --locked

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest
