[project]
name = "worth-db"
version = "0.1.0"
description = "The database half of worth-api: applies worth-fees' schema to Postgres, loads the pinned CMS vintages, and rebuilds a FeeSchedule from the rows."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Seen Institute" }]

# The one package in the workspace with a runtime dependency: the Postgres
# driver. worth-fees and worth-complexity stay standard-library only so a
# security review has nothing to audit but this package and its driver.
dependencies = [
    "psycopg[binary]>=3.2",
    "worth-fees",
]

[project.scripts]
worth-db = "worth_db.cli:main"

[tool.uv.sources]
worth-fees = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worth_db"
module-root = ""
